[filters]
# Minimum TVL in USD to consider a contract interesting
min_tvl_usd = 10000.0

# Maximum contract age in blocks to analyze (0 = no limit)
max_contract_age_blocks = 100000

# Only watch unverified contracts
watch_unverified_only = true

# Watch upgradeable proxies
watch_proxies = true

# Function selectors to flag as interesting (4-byte hex arrays)
# Example: flashLoan, createTranche, draw, repay
interesting_selectors = [
    [0x5c, 0xff, 0x2d, 0x4c],  # Aave V3 flashLoan
    [0xea, 0x7b, 0x0d, 0xec],  # Fence createTranche (from exploit)
    [0x76, 0x70, 0x81, 0xd1],  # Fence draw (from exploit)
]

[alerting]
# Minimum severity to alert on
min_severity = "Medium"

# Webhook URLs for alerts
webhook_urls = []

